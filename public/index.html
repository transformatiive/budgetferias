<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#26392c" />
    <title>Orçamento Férias — Suíça 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2326392c'/%3E%3Cpath d='M16 6l7 13H9z' fill='%23f7f4ee'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__top">
        <h1 class="header__title">Férias Suíça</h1>
        <span class="header__day mono" id="tripDay">—</span>
      </div>
      <div class="header__figures">
        <div class="figure">
          <span class="figure__label mono">Gasto</span>
          <span class="figure__value" id="totalSpent">—</span>
        </div>
        <div class="figure figure--right">
          <span class="figure__label mono">Esperado até hoje</span>
          <span class="figure__value" id="totalExpected">—</span>
        </div>
      </div>
      <div class="bar bar--header"><div class="bar__fill" id="headerBar"></div></div>
      <div class="header__foot">
        <span class="pill mono" id="totalDiff">—</span>
        <span class="header__note mono" id="totalPlanned">—</span>
      </div>
    </header>

    <main class="main">
      <section class="card">
        <h2 class="card__title">Gasto vs esperado</h2>
        <div class="chart-scroll"><div id="barChart" class="chart"></div></div>
        <div class="legend mono">
          <span><i class="swatch swatch--spent"></i>gasto</span>
          <span><i class="swatch swatch--expected"></i>esperado</span>
        </div>
      </section>

      <section class="card">
        <h2 class="card__title">Acumulado ao longo da viagem</h2>
        <div class="chart-scroll"><div id="lineChart" class="chart"></div></div>
      </section>

      <section id="categoryCards"></section>

      <section class="card">
        <h2 class="card__title">Despesas</h2>
        <ul class="expenses" id="expenseList"></ul>
      </section>
    </main>

    <button class="fab" id="openForm" type="button">+ Registar Despesa</button>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet__backdrop" data-close></div>
      <form class="sheet__panel" id="expenseForm" novalidate>
        <div class="sheet__head">
          <h2 class="card__title">Nova despesa</h2>
          <button type="button" class="sheet__close" data-close aria-label="Fechar">&times;</button>
        </div>
        <label class="field">
          <span class="field__label mono">Descrição</span>
          <input name="description" type="text" required autocomplete="off" />
        </label>
        <label class="field">
          <span class="field__label mono">Categoria</span>
          <select name="category" id="categorySelect" required></select>
        </label>
        <div class="field-row">
          <label class="field">
            <span class="field__label mono">Valor (€)</span>
            <input name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" required />
          </label>
          <label class="field">
            <span class="field__label mono">Data</span>
            <input name="expense_date" type="date" required />
          </label>
        </div>
        <label class="field">
          <span class="field__label mono">Nota (opcional)</span>
          <input name="note" type="text" autocomplete="off" />
        </label>
        <p class="form-error mono" id="formError" hidden></p>
        <button class="submit" type="submit">Guardar</button>
      </form>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
